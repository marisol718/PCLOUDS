<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - PClouds</title>
  <link rel="stylesheet" href="css/admin.css">
</head>

<body>
  <div class="sidebar">
    <div class="logo">
      <a href="../index.html">
        <img src="../imagenes/logo.png" alt="Logo" />
      </a>
    </div>
    <a href="#">
      <div class="circle"><img src="/imagenes/Historial.png" alt="Historial" /></div>
    </a>
    <a href="#">
      <div class="circle"><img src="/imagenes/Pronostico.png" alt="Pronóstico" /></div>
    </a>
    <a href="#">
      <div class="circle"><img src="/imagenes/Informacion.png" alt="Información" /></div>
    </a>
  </div>

  <div class="topbar">
    <a href="https://www.facebook.com/profile.php?id=61578839614625" target="_blank"><img src="/imagenes/facebook.png"
        alt="Facebook" /></a>
    <a href="https://www.instagram.com/pcloudsieru/" target="_blank"><img src="/imagenes/Instagram.png"
        alt="Instagram" /></a>
    <a href="https://x.com/PcloudsIeru" target="_blank"><img src="/imagenes/X.png" alt="X" /></a>
  </div>

  <div class="login-container">
    <div class="login-box">
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <input type="text" name="username" id="username" placeholder="Nombre de usuario" required />
        <input type="password" name="contrasena" id="password" placeholder="Contraseña" required />
        <button type="submit">Ingresar</button>
        <div id="mensaje"></div>
      </form>
      <p>¿No tienes cuenta? <a href="#">Regístrate aquí</a></p>
    </div>
  </div>
  <script src="js/login.js"></script>
</body>

</html>
